<text x="52" y="983" class="body" style=";font-size:20px">Las detecciones son observaciones térmicas; requieren interpretación y verificación en campo.</text>
<text x="52" y="1018" class="small" >Las imágenes aportan contexto visual. El visor funciona en navegador; los servicios se ejecutan en equipo o servidor propio.</text>

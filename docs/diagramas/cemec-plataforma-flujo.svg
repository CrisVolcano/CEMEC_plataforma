<text x="1035" y="818" class="body" style="fill:#edf4ef;font-size:20px">Mapa PDF georreferenciado · beta</text>
<text x="1035" y="852" class="body" style="fill:#edf4ef;font-size:20px">Datos CSV / GeoJSON</text>
<text x="1035" y="886" class="body" style="fill:#edf4ef;font-size:20px">Imágenes y metadatos por separado</text>

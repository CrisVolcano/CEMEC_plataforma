name: Verificar CEMEC

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniforge-version: latest
          activate-environment: cemec-ci
          environment-file: environment.yml
          conda-solver: libmamba
      - name: Revisar archivos para publicación
        run: python scripts/github_repository.py audit
      - name: Verificar la compilación original
        run: python scripts/replicate.py --verify-only
      - name: Pruebas deterministas sin claves API
        run: python -m unittest discover -s tests -p 'test_*.py'
